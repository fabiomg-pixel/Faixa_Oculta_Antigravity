name: Atualizar Faixa Oculta (Boletim Diário)

on:
  schedule:
    # 08:00 UTC = 05:00 BRT (Boletim da Manhã)
    - cron: '0 8 * * *'
    # 08:30 UTC = 05:30 BRT (Janela de redundância da manhã)
    - cron: '30 8 * * *'
    # 20:00 UTC = 17:00 BRT (Boletim da Noite)
    - cron: '0 20 * * *'
    # 20:30 UTC = 17:30 BRT (Janela de redundância da noite)
    - cron: '30 20 * * *'
  # Permite disparar manualmente pelo botão "Run workflow" no GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Executar apuração editorial com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tools/boletim_nuvem.py

      - name: Publicar alterações no GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/revista.json index.html
          git commit -m "Boletim diário automatizado na nuvem [skip ci]" || echo "Nenhuma alteração para commitar"
          git push
