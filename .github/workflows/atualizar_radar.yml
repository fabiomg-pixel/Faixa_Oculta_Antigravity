name: Atualizar Faixa Oculta (Boletins e Revistas)

on:
  schedule:
    # Salvaguarda Online (se o computador local atrasar ou estiver fechado):
    # Boletim Diário - Manhã: 09:30 UTC = 06:30 BRT
    - cron: '30 9 * * *'
    # Boletim Diário - Noite: 21:30 UTC = 18:30 BRT
    - cron: '30 21 * * *'
    # Revista da Semana - Quinta-feira (online): 01:00 UTC (sexta) = 22:00 BRT (quinta)
    - cron: '0 1 * * 5'
    # Cultura do Mês (Música, Filmes e Livros) - Todo dia 01: 11:00 UTC = 08:00 BRT
    - cron: '0 11 1 * *'
  # Permite disparar manualmente escolhendo a rotina
  workflow_dispatch:
    inputs:
      rotina:
        description: 'Qual rotina rodar'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - boletim
          - revista_semana
          - cultura_mensal
          - playlists
          - tudo

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 edge-tts Pillow

      - name: Executar apuração editorial na nuvem
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROTINA_SOLICITADA: ${{ inputs.rotina || 'auto' }}
        run: |
          python tools/orquestrador_nuvem.py

      - name: Publicar alterações no GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/revista.json index.html pagina.html audios/ capas/
          git commit -m "Atualização editorial automatizada na nuvem [skip ci]" || echo "Nenhuma alteração para commitar"
          git fetch origin main
          git rebase -X ours origin/main || (git rebase --abort || true; git merge -X ours origin/main --no-edit)
          git push origin main
