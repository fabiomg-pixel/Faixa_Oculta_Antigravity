name: Atualizar Faixa Oculta (Boletins e Revistas)

on:
  schedule:
    # Boletim Diário - Manhã: 08:00 UTC = 05:00 BRT
    - cron: '0 8 * * *'
    # Boletim Diário - Noite: 20:00 UTC = 17:00 BRT
    - cron: '0 20 * * *'
    # Revista da Semana - Quinta-feira à noite: 23:00 UTC = 20:00 BRT
    - cron: '0 23 * * 4'
    # Cultura do Mês (Música, Filmes e Livros) - Todo dia 01: 09:00 UTC = 06:00 BRT
    - cron: '0 9 1 * *'
  # Permite disparar manualmente escolhendo a rotina
  workflow_dispatch:
    inputs:
      rotina:
        description: 'Qual rotina rodar'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - boletim
          - revista_semana
          - cultura_mensal
          - tudo

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Executar apuração editorial na nuvem
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ROTINA_SOLICITADA: ${{ inputs.rotina || 'auto' }}
        run: |
          python tools/orquestrador_nuvem.py

      - name: Publicar alterações no GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/revista.json index.html
          git commit -m "Atualização editorial automatizada na nuvem [skip ci]" || echo "Nenhuma alteração para commitar"
          git push
